[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arh"
version = "0.1.0"
description = "Agent Reliability Harness — SRE-style trust and evaluation layer for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "akhilkinnera01" }]
dependencies = [
    "httpx>=0.25.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "prometheus-client>=0.19.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.0.0",
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
# Semantic similarity backbone for robustness/consistency (pulls torch).
semantic = ["sentence-transformers>=2.2.0"]
test = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0"]

[project.scripts]
arh = "arh.cli.main:app"

[tool.setuptools.packages.find]
include = ["arh*"]
